name: fzg

# 云端部署编排：nginx(80) -> app(5000) -> RDS/DCS/Neo4j
# 本地无云资源时可直接 `docker compose up -d` 以 SQLite + 内置 Redis 运行
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PREFETCH_EMBEDDING_MODEL: "${PREFETCH_EMBEDDING_MODEL:-true}"
        # 2C2G 等低内存机型设 LITE_MODE=true，跳过 torch 与 BGE 模型
        LITE_MODE: "${LITE_MODE:-false}"
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://repo.huaweicloud.com/repository/pypi/simple}"
        TORCH_INDEX_URL: "${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}"
        HF_ENDPOINT: "${HF_ENDPOINT:-https://hf-mirror.com}"
    image: fzg-app:${FZG_TAG:-latest}
    restart: unless-stopped
    # 小磁盘机型必须限制日志，否则 json-file 会持续增长
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      BACKEND_PORT: "5000"
      BACKEND_DEBUG: "false"
      BACKEND_USE_RELOADER: "false"
      # 未配置云端 Redis 时回落到本编排内的 redis 服务
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      AGENT_REDIS_URL: "${AGENT_REDIS_URL:-redis://redis:6379/2}"
      CELERY_BROKER_URL: "${CELERY_BROKER_URL:-redis://redis:6379/0}"
      CELERY_RESULT_BACKEND: "${CELERY_RESULT_BACKEND:-redis://redis:6379/1}"
    volumes:
      - fzg-data:/app/backend/data
      - fzg-logs:/app/backend/logs
    expose:
      - "5000"
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${HOST_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - fzg-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 异步任务（可选）：需要 Redis 可用；若使用 SQLite 请勿开启，避免多进程写同一库
  celery:
    image: fzg-app:${FZG_TAG:-latest}
    profiles: ["async"]
    restart: unless-stopped
    command: ["python", "-m", "celery", "-A", "app.server:celery_client", "worker", "-l", "info", "-P", "solo", "--concurrency=1"]
    working_dir: /app/backend
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: "${CELERY_BROKER_URL:-redis://redis:6379/0}"
      CELERY_RESULT_BACKEND: "${CELERY_RESULT_BACKEND:-redis://redis:6379/1}"
      AGENT_REDIS_URL: "${AGENT_REDIS_URL:-redis://redis:6379/2}"
    volumes:
      - fzg-data:/app/backend/data
      - fzg-logs:/app/backend/logs
    depends_on:
      redis:
        condition: service_healthy

volumes:
  fzg-data:
  fzg-logs:
  fzg-redis:
